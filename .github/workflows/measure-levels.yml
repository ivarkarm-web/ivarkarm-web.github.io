name: Measure instrument levels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run level measurement
        run: npx playwright test scripts/app-tests/instrument-levels.spec.mjs --project=desktop-1280x800

      - name: Upload level table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-levels
          path: test-results/instrument-levels/
          if-no-files-found: warn
