name: Handpan App Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: node scripts/smoke-test.mjs

      - name: App unit tests
        run: npm run test:app

      - name: Browser tests
        run: npx playwright test

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: handpan-app-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
