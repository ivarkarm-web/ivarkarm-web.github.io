name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    name: App checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Pionier cache manifest
        run: npm run check:handpan-cache

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: node scripts/smoke-test.mjs

      - name: App unit tests
        run: npm run test:app

      - name: Browser tests
        run: npx playwright test

      - name: Build minified Pionier app with Vite
        run: npm run build:app

      - name: Enforce minified CSS budget
        run: npm run check:app-css-size

      - name: Upload built Pionier app
        uses: actions/upload-artifact@v4
        with:
          name: pionier-built-app
          path: dist/handpan-app/
          if-no-files-found: error
          retention-days: 1

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: handpan-app-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deploy:
    name: Deploy verified build
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Pionier build
        uses: actions/download-artifact@v4
        with:
          name: pionier-built-app
          path: dist/handpan-app

      - name: Overlay built app into Pages route
        run: cp -a dist/handpan-app/. handpan-app/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
