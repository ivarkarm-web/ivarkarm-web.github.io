name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (smoke, unit, browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Node 20 ships with npm 10 on this runner; use npm 11 to avoid the
      # Arborist dependency-tree crash seen in npm install (null edgesOut).
      - name: Update npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Pionier cache manifest
        run: npm run check:handpan-cache

      - name: Purge and minify Pionier CSS
        # CI intentionally optimizes the ephemeral checkout so browser tests and
        # the deployed artifact exercise the exact shipping CSS payload.
        run: node scripts/optimize-handpan-css.mjs --allow-source

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: node scripts/smoke-test.mjs

      - name: App unit tests
        run: npm run test:app

      - name: Browser tests
        run: npx playwright test

      # Keep the budget audit after browser tests so a known size regression
      # cannot suppress the interaction and accessibility diagnostics.
      # Measures the optimized in-place artifact (exact shipping payload for Pages).
      - name: Production CSS gate (strict, optimized payload)
        run: node scripts/check-handpan-production-css.mjs --app-dir handpan-app --in-place-optimized

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: handpan-app-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Optimize Pionier CSS for deployment
        # Deploy uploads the repository root; optimize this ephemeral checkout.
        run: node scripts/optimize-handpan-css.mjs --allow-source

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
