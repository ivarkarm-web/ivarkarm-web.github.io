<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="stylesheet" href="./pionier-base.css?v=3" />
  <link rel="stylesheet" href="./pionier-controls.css?v=3" />
  <link rel="stylesheet" href="./pionier-layout.css?v=3" />
  <link rel="stylesheet" href="./pionier-ambient.css?v=8" />
  <link rel="stylesheet" href="./css-parts/sequence-carousel.css?v=5" />
  <title>Pionier Synth — Play, Explore, Create</title>
  <meta name="description" content="Pionier Synth is a touch-responsive musical instrument for exploring resonant handpan sounds, world instruments, expressive effects, looping and soundscapes. Start with 8 notes and shape your own sound." />
  <meta name="theme-color" content="#070708" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Pionier Audio" />
  <meta property="og:title" content="Pionier Audio — Handpan" />
  <meta property="og:description" content="A minimal, touch-responsive virtual handpan. Explore resonant sounds, scales, loops and soundscapes." />
  <meta property="og:image" content="https://ivarkarm-web.github.io/handpan-app/og-pionier-audio.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script>document.documentElement.classList.add("pionier-welcome-active");window.PionierWelcomeState={hideTonefields:true};</script>
  <style>
    .backdrop-player { display: none !important; }
    .play-pill, #modePlay, #btnHelp, #btnExit, .top-actions,
    #createLaunch, .create-launch, #createPage, .create-page { display: none !important; }
    .stage {
      --stage-bottom-reserve: calc(var(--chrome-bottom, 160px) + var(--pan-bottom-gap, 10px));
      padding: max(8px, var(--chrome-top, 48px)) 8px var(--stage-bottom-reserve) 8px !important;
      flex-direction: column;
      position: relative !important;
      align-items: center !important;
      justify-content: flex-end !important;
      overflow: hidden !important;
      min-height: 0 !important;
      flex: 1 1 auto !important;
      box-sizing: border-box !important;
    }
    #pan {
      display: block !important;
      aspect-ratio: 1 !important;
      margin-bottom: 0 !important;
    }
  </style>
</head>
<body>
  <div id="portraitLock" class="portrait-lock" hidden aria-live="polite">
    <p class="portrait-lock-msg">Rotate your phone to portrait</p>
  </div>
  <div id="appStatus" class="app-status" data-state="loading" role="status" aria-live="polite">
    <span id="appStatusMessage">Starting Pionier…</span>
    <button type="button" id="appStatusRetry" class="app-status-retry" hidden>Retry</button>
  </div>
  <section id="pionierWelcome" aria-label="Welcome to Pionier">
    <div class="welcome-masthead">
      <span class="welcome-brand"><span class="welcome-brand-main">PIONIER</span><span class="welcome-brand-audio">AUDIO</span><span class="welcome-brand-handpan">HANDPAN</span></span>
      <span class="welcome-edition">POCKET INSTRUMENT&nbsp; / &nbsp;NO. 01</span>
    </div>
    <div class="pionier-welcome-content">
      <span class="welcome-kicker"><span class="welcome-kicker-dot"></span> SOUND, SHAPED BY YOU</span>
      <h1 class="welcome-headline">A little space<br><em>to make sound.</em></h1>
      <p class="welcome-deck">A touch-responsive instrument for exploring tones, textures and loops.</p>
      <button type="button" id="enterPionier"><span>Enter Pionier</span><span class="welcome-enter-arrow" aria-hidden="true">↗</span></button>
    </div>
    <div class="welcome-foot">
      <span>LISTEN&nbsp; · &nbsp;EXPLORE&nbsp; · &nbsp;CREATE</span>
      <span class="welcome-foot-rule"></span>
      <span>MADE FOR THE MOMENT</span>
    </div>
  </section>
  <div id="headphonesHint" role="status" aria-live="polite"><span class="headphones-word headphones-word-one">Headphones</span><span class="headphones-word headphones-word-two">recommended</span></div>
  <div id="app" class="app">
    <header class="topbar topbar-minimal">
      <div class="center-nav">
        <div class="instrument-nav" id="instrumentNav">
          <button type="button" class="icon-btn" id="voicePrev" aria-label="Previous voice">‹</button>
          <button type="button" class="instrument-name" id="instrumentDropdownToggle" aria-haspopup="true" aria-expanded="false" aria-controls="instrumentMenu">Handpan ▾</button>
          <button type="button" class="icon-btn" id="voiceNext" aria-label="Next voice">›</button>
          <button type="button" class="icon-btn soundscapes-open-btn" id="openSoundscapes" aria-label="Open Soundscapes" title="Soundscapes">♫</button>
          <button type="button" class="randomize-setup-btn" id="randomizeSetup" aria-label="Randomize" title="Surprise me">🎲</button>
        </div>
      </div>
    </header>
    <div class="instrument-menu" id="instrumentMenu" role="menu" aria-label="Choose instrument" hidden></div>
    <div class="mobile-control-drawer" id="mobileControlDrawer">
      <button type="button" class="mobile-controls-toggle" id="mobileControlsToggle" hidden aria-expanded="false" aria-controls="mobileControlPanel">
        <span class="mobile-controls-grip" aria-hidden="true"></span>
        <span class="mobile-controls-label">Controls</span>
      </button>
      <div class="mobile-control-panel" id="mobileControlPanel">
    <aside class="sidebar left">
      <div class="control-block control-scale">
        <label class="control-label">Scale</label>
        <div class="stepper scale-stepper">
          <button type="button" class="step" id="scalePrev" aria-label="Previous scale">‹</button>
          <button type="button" class="step-value scale-name scale-dropdown-toggle" id="scaleLabel" aria-haspopup="true" aria-expanded="false" aria-controls="scaleMenu" title="Choose scale">D3 Kurd ▾</button>
          <button type="button" class="step" id="scaleNext" aria-label="Next scale">›</button>
        </div>
        <div class="scale-menu" id="scaleMenu" role="menu" aria-label="Choose scale" hidden></div>
      </div>
      <div class="control-row">
        <div class="control-block control-half">
          <label class="control-label">Base Note</label>
          <div class="stepper">
            <button type="button" class="step" id="rootPrev" aria-label="Previous base note">‹</button>
            <span class="step-value" id="rootLabel">D3</span>
            <button type="button" class="step" id="rootNext" aria-label="Next base note">›</button>
          </div>
        </div>
        <div class="control-block control-half">
          <label class="control-label">Notes</label>
          <div class="stepper">
            <button type="button" class="step" id="noteCountPrev" aria-label="Fewer notes">‹</button>
            <span class="step-value" id="noteCountLabel">8</span>
            <button type="button" class="step" id="noteCountNext" aria-label="More notes">›</button>
          </div>
        </div>
      </div>
    </aside>
      </div>
    </div>
    <div id="looperRail" class="looper-rail" aria-label="Looper">
      <button type="button" id="looperClearBtn" class="looper-clear-btn" aria-label="Clear loops" title="Clear">×</button>
      <div id="looperRecordCluster" class="looper-record-cluster">
        <button type="button" id="looperBtn" class="looper-btn looper-record" aria-label="Record loop" title="Record loop"><span class="looper-btn-ring" aria-hidden="true"></span><span class="looper-btn-core" aria-hidden="true"></span></button>
      </div>
      <div id="looperLayers" class="looper-layers" aria-label="Loop layers"></div>
    </div>
    <main class="stage" id="stage">
      <canvas id="pan" width="680" height="680" role="img" aria-label="Handpan instrument"></canvas>
    </main>
  </div>
  <section id="soundscapesPanel" class="soundscapes-panel" hidden aria-label="Backing Tracks"></section>
  <div id="fxPanel" class="fx-panel" hidden></div>
  <audio id="soundscapeAudio" preload="metadata" playsinline></audio>
  <script src="./js/skin-palette.js?v=3"></script>
  <script src="./js/customization-catalog.js?v=7"></script>
  <script src="./js/overlay-controller.js?v=23"></script>
  <script src="./js/layout-boot.js?v=70"></script>
  <script src="./pionier-control-layout.js?v=22"></script>
  <script src="./looper-side-menus.js?v=10"></script>
  <script src="./looper-circle-progress.js?v=2"></script>
  <script src="./js/settings-panel.js?v=33"></script>
  <script src="./js/coach-marks.js?v=1"></script>
  <script src="./js/favorites.js?v=1"></script>
  <script src="./js/ambient-fx.js?v=12"></script>
  <script src="./js/skin-mandala.js?v=6"></script>
  <script type="module" src="./pionier-app.js?v=269"></script>
  <script src="./js/sequence-carousel-patch.js?v=2"></script>
  <script src="./welcome-screen.js?v=9"></script>
  <script src="./js/portrait-lock.js?v=2"></script>
  <script src="./registerSW.js?v=2"></script>
</body>
</html>
