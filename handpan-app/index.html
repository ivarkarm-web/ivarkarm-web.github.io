<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pionier — loading…</title>
  <meta name="theme-color" content="#070708" />
  <style>
    html, body { margin: 0; background: #08080a; color: #eceae6; font: 14px/1.4 system-ui, sans-serif; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; opacity: 0.75; }
  </style>
</head>
<body>
  <div id="boot">Starting Pionier…</div>
  <script>
  (async function () {
    var boot = document.getElementById('boot');
    try {
      var url = 'https://raw.githubusercontent.com/ivarkarm-web/ivarkarm-web.github.io/9a058a8ccbf51905c486dbdc235a08b827dd52a2/handpan-app/index.html';
      var res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var html = await res.text();

      html = html.replace(/handpan\.js\?v=\d+/g, 'handpan.js?v=12');
      html = html.replace(/pad-layout\.js\?v=\d+/g, 'pad-layout.js?v=3');
      html = html.replace(/pionier-surface\.js\?v=\d+/g, 'pionier-surface.js?v=153');
      html = html.replace(/skin-palette\.js\?v=\d+/g, 'skin-palette.js?v=2');
      html = html.replace(/customization-catalog\.js\?v=\d+/g, 'customization-catalog.js?v=7');
      html = html.replace(/settings-panel\.js\?v=\d+/g, 'settings-panel.js?v=30');
      html = html.replace(/skin-mandala\.js\?v=\d+/g, 'skin-mandala.js?v=6');
      html = html.replace('href="./fx-editor.css?v=4"', 'href="./fx-editor.css?v=5"');

      if (html.indexOf('pionier-control-layout.css') === -1) {
        html = html.replace('</head>', '  <link rel="stylesheet" href="./pionier-control-layout.css?v=3" />\n</head>');
      }

      if (html.indexOf('handpan-themes.css') === -1) {
        html = html.replace('</head>', '  <link rel="stylesheet" href="./handpan-themes.css?v=2" />\n</head>');
      } else {
        html = html.replace(/handpan-themes\.css\?v=\d+/, 'handpan-themes.css?v=2');
      }
      if (html.indexOf('theme-light-overlays.css') === -1) {
        html = html.replace(
          '<link rel="stylesheet" href="./fx-editor.css?v=5" />',
          '<link rel="stylesheet" href="./fx-editor.css?v=5" />\n  <link rel="stylesheet" href="./theme-light-overlays.css?v=2" />'
        );
      } else {
        html = html.replace(/theme-light-overlays\.css\?v=\d+/, 'theme-light-overlays.css?v=2');
      }
      if (html.indexOf('looper-layout-fix.css') === -1) {
        var looperLink = '<link rel="stylesheet" href="./looper-layout-fix.css?v=5" />';
        if (/looper\.css\?v=/.test(html)) {
          html = html.replace(/<link rel="stylesheet" href="\.\/looper\.css\?v=[^"]+" \/>/, function (m) { return m + '\n  ' + looperLink; });
        } else {
          html = html.replace('</head>', '  ' + looperLink + '\n</head>');
        }
      }

      function injectScript(src) {
        if (html.indexOf(src.split('?')[0]) === -1) {
          html = html.replace('</body>', '  <script src="' + src + '"><\/script>\n</body>');
        } else {
          var base = src.split('?')[0];
          html = html.replace(new RegExp(base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\?v=\\d+'), src);
        }
      }
      injectScript('./looper-side-menus.js?v=3');
      injectScript('./looper-restart-on-record.js?v=2');
      injectScript('./phase1-note-count-guard.js?v=2');
      injectScript('./js/phase3-handpan-theme.js?v=1');
      injectScript('./pionier-control-layout.js?v=3');

      var fxFix = [
        '<script>',
        '(function () {',
        '  if (window.__pionierFxFix) return;',
        '  window.__pionierFxFix = true;',
        '  function ensureBtn() {',
        '    var btn = document.getElementById("fxPanelOpen");',
        '    if (btn) return btn;',
        '    btn = document.createElement("button");',
        '    btn.type = "button"; btn.id = "fxPanelOpen"; btn.className = "fx-panel-open";',
        '    btn.setAttribute("aria-label", "Effects"); btn.textContent = "FX";',
        '    document.body.appendChild(btn); return btn;',
        '  }',
        '  function toggle() {',
        '    var panel = document.getElementById("fxPanel");',
        '    if (!panel) return;',
        '    var open = !panel.hidden && getComputedStyle(panel).display !== "none";',
        '    if (open) { panel.hidden = true; document.body.classList.remove("is-fx-open"); }',
        '    else { panel.hidden = false; panel.removeAttribute("hidden"); panel.style.setProperty("display","block","important"); panel.style.setProperty("z-index","5000","important"); document.body.classList.add("is-fx-open"); }',
        '  }',
        '  document.addEventListener("click", function (e) {',
        '    var t = e.target; if (!t || !t.closest) return;',
        '    if (!t.closest("#fxPanelOpen, button.fx-panel-open")) return;',
        '    e.preventDefault(); e.stopPropagation(); toggle();',
        '  }, true);',
        '  function bootFx() { ensureBtn(); }',
        '  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootFx); else bootFx();',
        '  setTimeout(bootFx, 400);',
        '})();',
        '<\/script>'
      ].join('\n');
      if (html.indexOf('__pionierFxFix') === -1) {
        html = html.replace('</body>', fxFix + '\n</body>');
      }

      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      boot.textContent = 'Failed to load Pionier: ' + e;
      console.error(e);
    }
  })();
  </script>
</body>
</html>
