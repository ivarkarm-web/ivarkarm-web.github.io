<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Handpan — Ivar Karm</title>
  <meta name="description" content="Playable virtual handpan — radial instrument that grows from 9 to 14 notes, with sampled notes, interval scales, and expressive effects." />
  <meta name="theme-color" content="#070708" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./pionier.css?v=144" />
  <link rel="stylesheet" href="./topbar-narrow.css?v=6" />
  <link rel="stylesheet" href="./looper.css?v=205" />
  <link rel="stylesheet" href="./scale-menu.css?v=7" />
  <link rel="stylesheet" href="./settings-panel.css?v=18" />
  <style>
    .backdrop-player { display: none !important; }
    .play-pill, #modePlay, #btnHelp, #btnExit, .top-actions,
    #createLaunch, .create-launch, #createPage, .create-page { display: none !important; }

    .stage {
      --stage-bottom-reserve: calc(var(--chrome-bottom, 160px) + var(--pan-bottom-gap, 10px));
      padding: max(8px, var(--chrome-top, 48px)) 8px var(--stage-bottom-reserve) 8px !important;
      flex-direction: column;
      position: relative !important;
      align-items: center !important;
      justify-content: flex-end !important;
      overflow: hidden !important;
      min-height: 0 !important;
      flex: 1 1 auto !important;
      box-sizing: border-box !important;
    }
    #pan {
      display: block !important;
      aspect-ratio: 1 !important;
      margin-bottom: 0 !important;
    }
    .stage::before {
      left: 50% !important;
      top: auto !important;
      bottom: calc(var(--stage-bottom-reserve) + var(--pan-budget, 40vw) / 2) !important;
      transform: translate(-50%, 50%) !important;
      width: min(80vw, calc(100dvh - 260px), 640px) !important;
      height: min(80vw, calc(100dvh - 260px), 640px) !important;
    }
  </style>
  <link rel="stylesheet" href="./atelier.css?v=10">
  <!-- ui-layout-extras.css retired: layout lives in pionier.css -->
  <link rel="stylesheet" href="./ui-stability.css?v=5" />
</head>
<body>
  <div id="appStatus" class="app-status" data-state="loading" role="status" aria-live="polite">
    <span id="appStatusMessage">Starting Pionier…</span>
    <button type="button" id="appStatusRetry" class="app-status-retry" hidden>Retry</button>
  </div>
  <div id="app" class="app">
    <header class="topbar topbar-minimal">
      <div class="center-nav">
        <div class="instrument-nav" id="instrumentNav">
          <button type="button" class="icon-btn" id="voicePrev" aria-label="Previous voice">‹</button>
          <button type="button" class="instrument-name" id="instrumentDropdownToggle" aria-haspopup="true" aria-expanded="false" aria-controls="instrumentMenu">Handpan ▾</button>
          <button type="button" class="icon-btn" id="voiceNext" aria-label="Next voice">›</button>
          <button type="button" class="icon-btn soundscapes-open-btn" id="openSoundscapes" aria-label="Open Soundscapes" title="Soundscapes">♫</button>
        </div>
      </div>
    </header>
    <div class="instrument-menu" id="instrumentMenu" role="menu" aria-label="Choose instrument" hidden></div>

    <div class="mobile-control-drawer" id="mobileControlDrawer">
      <button type="button" class="mobile-controls-toggle" id="mobileControlsToggle" hidden aria-expanded="false" aria-controls="mobileControlPanel">
        <span class="mobile-controls-grip" aria-hidden="true"></span>
        <span class="mobile-controls-label">Controls</span>
      </button>
      <div class="mobile-control-panel" id="mobileControlPanel">
    <aside class="sidebar left">
      <div class="control-block control-scale">
        <label class="control-label">Scale</label>
        <div class="stepper scale-stepper">
          <button type="button" class="step" id="scalePrev" aria-label="Previous scale">‹</button>
          <button type="button" class="step-value scale-name scale-dropdown-toggle" id="scaleLabel" aria-haspopup="true" aria-expanded="false" aria-controls="scaleMenu" title="Choose scale">D3 Kurd ▾</button>
          <button type="button" class="step" id="scaleNext" aria-label="Next scale">›</button>
        </div>
        <div class="scale-menu" id="scaleMenu" role="menu" aria-label="Choose scale" hidden></div>
      </div>

      <div class="control-row">
        <div class="control-block control-half">
          <label class="control-label">Base Note</label>
          <div class="stepper">
            <button type="button" class="step" id="rootPrev" aria-label="Previous base note">‹</button>
            <span class="step-value" id="rootLabel">D3</span>
            <button type="button" class="step" id="rootNext" aria-label="Next base note">›</button>
          </div>
        </div>
        <div class="control-block control-half">
          <label class="control-label">Notes</label>
          <div class="stepper">
            <button type="button" class="step" id="noteCountPrev" aria-label="Fewer notes">‹</button>
            <span class="step-value" id="noteCountLabel">9</span>
            <button type="button" class="step" id="noteCountNext" aria-label="More notes">›</button>
          </div>
        </div>
      </div>
    </aside>
      </div>
    </div>

    <div id="looperRail" class="looper-rail" aria-label="Looper">
      <button type="button" id="looperClearBtn" class="looper-clear-btn" aria-label="Clear loops" title="Clear">×</button>
      <div id="looperRecordCluster" class="looper-record-cluster">
        <button type="button" id="looperBtn" class="looper-btn looper-record" aria-label="Record loop" title="Record loop"><span class="looper-btn-ring" aria-hidden="true"></span><span class="looper-btn-core" aria-hidden="true"></span></button>
      </div>
      <div id="looperLayers" class="looper-layers" aria-label="Loop layers"></div>
    </div>

    <main class="stage" id="stage">
      <canvas id="pan" width="680" height="680" role="img" aria-label="Handpan instrument"></canvas>
    </main>
  </div>

  <section id="soundscapesPanel" class="soundscapes-panel" hidden aria-label="Bedroom Sessions">
    <header class="soundscapes-header">
      <h2>Bedroom Sessions</h2>
      <button type="button" id="closeSoundscapes" class="soundscapes-return-btn" aria-label="Return to Handpan">
        ← Return to Handpan
      </button>
    </header>
    <main class="soundscapes-body" id="soundscapesBody">
      <div class="soundscape-now">
        <p id="soundscapeTitle" class="soundscape-title">E Amara · Improvisation 1</p>
        <p id="soundscapeNote" class="soundscape-note">Owner recordings</p>
      </div>
      <div class="soundscape-transport">
        <button type="button" class="soundscape-transport-btn" id="soundscapePrev" aria-label="Previous track">‹</button>
        <button type="button" class="soundscape-play" id="soundscapePlay" aria-label="Play">▶</button>
        <button type="button" class="soundscape-transport-btn" id="soundscapeNext" aria-label="Next track">›</button>
        <button type="button" class="soundscape-transport-btn" id="soundscapeRepeat" aria-label="Repeat" aria-pressed="false">↻</button>
      </div>
      <div class="soundscape-seek-row">
        <span id="soundscapeTime">0:00</span>
        <input id="soundscapeSeek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="soundscapeTimeTotal">0:00</span>
      </div>
      <label class="soundscape-vol-row"><span>Volume</span>
        <input id="soundscapeVolume" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Track volume">
      </label>
      <p class="soundscape-status" id="soundscapeStatus" role="status">Bedroom Sessions · 8 tracks</p>
      <div id="soundscapeQueue" class="soundscape-queue" role="list" aria-label="Track list"></div>
    </main>
  </section>

  <div id="fxPanel" class="fx-panel" hidden>
    <header class="fx-panel-header">
      <h2>Effects</h2>
      <button type="button" id="fxPanelClose" class="icon-btn" aria-label="Close effects">×</button>
    </header>
    <div class="fx-panel-body knobs-panel">
      <div class="effect-knob-wrap" id="knobCompress"><canvas class="knob-canvas" width="68" height="68"></canvas><span class="knob-label">Comp</span><span class="knob-val" id="valCompress">40%</span></div>
      <div class="effect-knob-wrap" id="knobDelay"><canvas class="knob-canvas" width="68" height="68"></canvas><span class="knob-label">Delay</span><span class="knob-val" id="valDelay">15%</span></div>
      <div class="effect-knob-wrap" id="knobReverb"><canvas class="knob-canvas" width="68" height="68"></canvas><span class="knob-label">Reverb</span><span class="knob-val" id="valReverb">25%</span></div>
      <div class="effect-knob-wrap" id="knobFilter"><canvas class="knob-canvas" width="68" height="68"></canvas><span class="knob-label">Filter</span><span class="knob-val" id="valFilter">12%</span></div>
      <div class="effect-knob-wrap" id="knobBass"><canvas class="knob-canvas" width="72" height="72"></canvas><span class="knob-label">Bass</span><span class="knob-val" id="valBass">50%</span></div>
      <div class="effect-knob-wrap" id="knobLow"><canvas class="knob-canvas" width="72" height="72"></canvas><span class="knob-label">Low</span><span class="knob-val" id="valLow">50%</span></div>
      <div class="effect-knob-wrap" id="knobMid"><canvas class="knob-canvas" width="72" height="72"></canvas><span class="knob-label">Mid</span><span class="knob-val" id="valMid">50%</span></div>
      <div class="effect-knob-wrap" id="knobMaster"><canvas class="knob-canvas" width="72" height="72"></canvas><span class="knob-label">Master</span><span class="knob-val" id="valMaster">82%</span></div>
    </div>
  </div>

  <audio id="soundscapeAudio" preload="metadata" playsinline></audio>

  <script src="./js/skin-palette.js?v=1"></script>
  <script src="./js/customization-catalog.js?v=5"></script>
  <script src="./js/overlay-controller.js?v=10"></script>
  <script src="./js/layout-boot.js?v=65"></script>
  <script src="./js/settings-panel.js?v=26"></script>
  <script src="./js/ambient-fx.js?v=12"></script>
  <script src="./js/skin-mandala.js?v=4"></script>
  <script type="module" src="./pionier-app.js?v=192"></script>
  <script src="./registerSW.js"></script>
</body>
</html>
