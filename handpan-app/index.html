<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Handpan — Ivar Karm</title>
  <meta name="theme-color" content="#070708" />
  <style>body{margin:0;background:#070708;color:#ccc;font-family:system-ui;display:grid;place-items:center;min-height:100dvh}</style>
</head>
<body>
  <div id="appBoot">Loading handpan…</div>
  <script>
  (async () => {
    const r = await fetch('./app-shell.html?v=3');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();
    document.open();
    document.write(html);
    document.close();
  })().catch(e => {
    document.getElementById('appBoot').textContent = 'Failed to load: ' + e;
  });
  </script>
</body>
</html>
