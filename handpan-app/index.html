<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  <title>Handpan — Ivar Karm</title>
  <meta name="description" content="Playable virtual handpan — radial instrument that grows from 9 to 13 notes, with interval scales and dynamic transposition." />
  <meta name="theme-color" content="#070708" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./pionier.css?v=101" />
  <link rel="stylesheet" href="./looper.css?v=108" />
  <link rel="stylesheet" href="./scale-menu.css?v=2" />
  <link rel="stylesheet" href="./learn-mode.css?v=8" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((r) => r.unregister());
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
    }
  </script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button type="button" class="pill play-pill" id="modePlay" title="Play mode">
        <span class="dot"></span> play
      </button>
      <div class="center-nav">
        <div class="instrument-nav" id="instrumentNav">
          <button type="button" class="icon-btn" id="voicePrev" aria-label="Previous voice">‹</button>
          <button type="button" class="instrument-name" id="instrumentDropdownToggle" aria-haspopup="true" aria-expanded="false" aria-controls="instrumentMenu">Handpan ▾</button>
          <button type="button" class="icon-btn" id="voiceNext" aria-label="Next voice">›</button>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="btnHelp" aria-label="Help" title="Help">?</button>
        <button type="button" class="icon-btn exit-btn" id="btnExit" aria-label="Exit" title="Exit">×</button>
      </div>
    <button type="button" class="pill learn-launch" id="learnLaunch" title="Guided lessons">learn</button>
    </header>
    <div class="instrument-menu" id="instrumentMenu" role="menu" aria-label="Choose instrument" hidden></div>

    <div class="mobile-control-drawer" id="mobileControlDrawer">
      <button type="button" class="mobile-controls-toggle" id="mobileControlsToggle" aria-expanded="false" aria-controls="mobileControlPanel">
        <span class="mobile-controls-grip" aria-hidden="true"></span>
        <span class="mobile-controls-label">Controls</span>
      </button>
      <div class="mobile-control-panel" id="mobileControlPanel">
    <aside class="sidebar left">
      <div class="control-block control-scale">
        <label class="control-label">Scale</label>
        <div class="stepper scale-stepper">
          <button type="button" class="step" id="scalePrev" aria-label="Previous scale">‹</button>
          <button type="button" class="step-value scale-name scale-dropdown-toggle" id="scaleLabel" aria-haspopup="true" aria-expanded="false" aria-controls="scaleMenu" title="Choose scale">Celtic Minor ▾</button>
          <button type="button" class="step" id="scaleNext" aria-label="Next scale">›</button>
        </div>
        <div class="scale-menu" id="scaleMenu" role="menu" aria-label="Choose scale" hidden></div>
      </div>

      <div class="control-row">
        <div class="control-block control-half">
          <label class="control-label">Base Note</label>
          <div class="stepper">
            <button type="button" class="step" id="rootDown" aria-label="Lower root">−</button>
            <span class="step-value" id="rootLabel">D</span>
            <button type="button" class="step" id="rootUp" aria-label="Raise root">+</button>
          </div>
        </div>
        <div class="control-block control-half">
          <label class="control-label">Octave</label>
          <div class="stepper">
            <button type="button" class="step" id="octDown" aria-label="Octave down">−</button>
            <span class="step-value" id="octLabel">0</span>
            <button type="button" class="step" id="octUp" aria-label="Octave up">+</button>
          </div>
        </div>
      </div>
    </aside>

    <aside class="sidebar right knobs-panel" aria-label="Sound knobs">
      <div class="knob-wrap effect-knob-wrap" data-param="compress">
        <div class="knob" id="knobCompress" role="slider" tabindex="0" aria-label="Compressor amount" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40"><canvas class="knob-canvas" width="68" height="68" aria-hidden="true"></canvas><span class="knob-value" id="valCompress">40</span></div>
        <div class="knob-name-row"><button type="button" class="knob-effect-trigger" aria-expanded="false" aria-controls="bubbleComp"><span>Comp</span><span class="tiny-gear" aria-hidden="true">⚙</span></button></div>
        <div class="effect-bubble" id="bubbleComp" hidden aria-label="Compressor type"><span class="effect-bubble-title">Compressor</span><div class="effect-choice-list"><button type="button" class="fx-type-btn is-active" data-comp="soft" aria-pressed="true">Soft</button><button type="button" class="fx-type-btn" data-comp="punch" aria-pressed="false">Punch</button><button type="button" class="fx-type-btn" data-comp="glue" aria-pressed="false">Glue</button><button type="button" class="fx-type-btn" data-comp="limit" aria-pressed="false">Limit</button></div></div>
      </div>
      <div class="knob-wrap effect-knob-wrap" data-param="delay">
        <div class="knob" id="knobDelay" role="slider" tabindex="0" aria-label="Ambiance amount" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15"><canvas class="knob-canvas" width="68" height="68" aria-hidden="true"></canvas><span class="knob-value" id="valDelay">15</span></div>
        <div class="knob-name-row"><button type="button" class="knob-effect-trigger" aria-expanded="false" aria-controls="bubbleAmbiance"><span>Ambiance</span><span class="tiny-gear" aria-hidden="true">⚙</span></button></div>
        <div class="effect-bubble" id="bubbleAmbiance" hidden aria-label="Ambiance type"><span class="effect-bubble-title">Ambiance</span><div class="effect-choice-list"><button type="button" class="fx-type-btn is-active" data-delay="echo" aria-pressed="true">Echo</button><button type="button" class="fx-type-btn" data-delay="slap" aria-pressed="false">Slap</button><button type="button" class="fx-type-btn" data-delay="ping" aria-pressed="false">Ping</button><button type="button" class="fx-type-btn" data-delay="dub" aria-pressed="false">Dub</button></div></div>
      </div>
      <div class="knob-wrap effect-knob-wrap" data-param="reverb">
        <div class="knob" id="knobReverb" role="slider" tabindex="0" aria-label="Room amount" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25"><canvas class="knob-canvas" width="68" height="68" aria-hidden="true"></canvas><span class="knob-value" id="valReverb">25</span></div>
        <div class="knob-name-row"><button type="button" class="knob-effect-trigger" aria-expanded="false" aria-controls="bubbleRoom"><span>Room</span><span class="tiny-gear" aria-hidden="true">⚙</span></button></div>
        <div class="effect-bubble" id="bubbleRoom" hidden aria-label="Reverb type"><span class="effect-bubble-title">Reverb</span><div class="effect-choice-list"><button type="button" class="fx-type-btn is-active" data-reverb="room" aria-pressed="true">Room</button><button type="button" class="fx-type-btn" data-reverb="hall" aria-pressed="false">Hall</button><button type="button" class="fx-type-btn" data-reverb="plate" aria-pressed="false">Plate</button><button type="button" class="fx-type-btn" data-reverb="cave" aria-pressed="false">Cave</button></div></div>
      </div>
      <div class="knob-wrap effect-knob-wrap" data-param="filter">
        <div class="knob" id="knobFilter" role="slider" tabindex="0" aria-label="Filter amount" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12"><canvas class="knob-canvas" width="68" height="68" aria-hidden="true"></canvas><span class="knob-value" id="valFilter">12</span></div>
        <div class="knob-name-row"><button type="button" class="knob-effect-trigger" aria-expanded="false" aria-controls="bubbleFilter"><span>Filter</span><span class="tiny-gear" aria-hidden="true">⚙</span></button></div>
        <div class="effect-bubble" id="bubbleFilter" hidden aria-label="Filter type"><span class="effect-bubble-title">Effects · Filters</span><div class="effect-choice-list"><button type="button" class="fx-type-btn is-active" data-filter="lowpass" aria-pressed="true">Low Pass</button><button type="button" class="fx-type-btn" data-filter="highpass" aria-pressed="false">High Pass</button><button type="button" class="fx-type-btn" data-filter="band" aria-pressed="false">Band Pass</button><button type="button" class="fx-type-btn" data-filter="notch" aria-pressed="false">Notch</button></div></div>
      </div>
      <div class="knob-row tone-knobs" aria-label="Tone and master">
        <div class="knob-wrap" data-param="bass">
          <div class="knob" id="knobBass" role="slider" tabindex="0" aria-label="Bass" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><canvas class="knob-canvas" width="72" height="72" aria-hidden="true"></canvas><span class="knob-value" id="valBass">50</span></div>
          <div class="knob-name-row"><span>Bass</span></div>
        </div>
        <div class="knob-wrap" data-param="low">
          <div class="knob" id="knobLow" role="slider" tabindex="0" aria-label="Low" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><canvas class="knob-canvas" width="72" height="72" aria-hidden="true"></canvas><span class="knob-value" id="valLow">50</span></div>
          <div class="knob-name-row"><span>Low</span></div>
        </div>
        <div class="knob-wrap" data-param="mid">
          <div class="knob" id="knobMid" role="slider" tabindex="0" aria-label="Mid" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><canvas class="knob-canvas" width="72" height="72" aria-hidden="true"></canvas><span class="knob-value" id="valMid">50</span></div>
          <div class="knob-name-row"><span>Mid</span></div>
        </div>
        <div class="knob-wrap" data-param="master">
          <div class="knob" id="knobMaster" role="slider" tabindex="0" aria-label="Master" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80"><canvas class="knob-canvas" width="72" height="72" aria-hidden="true"></canvas><span class="knob-value" id="valMaster">80</span></div>
          <div class="knob-name-row"><span>Master</span></div>
        </div>
      </div>
    </aside>
      </div>
    </div>

    <main class="stage">
      <canvas id="pan" width="800" height="800" aria-label="Handpan instrument" draggable="false"></canvas>
    </main>

    <div class="looper-rail" id="looperRail" aria-label="Looper">
      <div class="looper-layers" id="looperLayers" aria-hidden="true"></div>
      <button type="button" class="looper-btn" id="looperBtn" aria-label="Start loop recording" title="Record loop layer">
        <span class="looper-btn-ring" aria-hidden="true"></span>
        <span class="looper-btn-core" aria-hidden="true"></span>
      </button>
    </div>

    <button type="button" class="looper-clear-btn" id="looperClearBtn" aria-label="Clear all loops" title="Clear all loops">
      <span class="looper-clear-ring" aria-hidden="true"></span>
      <span class="looper-clear-core" aria-hidden="true"><span class="looper-clear-x"></span></span>
    </button>

    <div class="backdrop-player" id="backdropPlayer" aria-label="Background music">
      <button type="button" class="bp-btn" data-act="prev" aria-label="Previous track">‹</button>
      <button type="button" class="bp-btn bp-play" data-act="play" aria-label="Play">▶</button>
      <button type="button" class="bp-btn" data-act="next" aria-label="Next track">›</button>
      <span class="bp-name" data-track-name>Mist Drone</span>
      <label class="bp-vol" title="Volume">
        <span class="bp-vol-icon" aria-hidden="true">♪</span>
        <input type="range" data-volume min="0" max="100" value="55" aria-label="Background volume" />
      </label>
      <div class="note-plus-wrap" id="notePlusWrap">
        <button type="button" class="note-plus" id="notePlus" aria-label="Add the next scale note" title="Add the next scale note">
          <span class="note-plus-icon" aria-hidden="true"></span>
        </button>
        <span class="note-plus-count" id="notePlusCount" aria-live="polite">9/13</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
  </script>
  <script type="module" src="./pionier-app.js?v=108"></script>
  <script type="module" src="./js/learn-mode.js?v=6"></script>
</body>
</html>
