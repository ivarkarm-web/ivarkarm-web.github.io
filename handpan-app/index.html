<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Handpan — Ivar Karm</title>
  <meta name="description" content="Playable virtual handpan — 9-note radial instrument with interval scales and dynamic transposition." />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./pionier.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Top bar -->
    <header class="topbar">
      <button type="button" class="pill play-pill" id="modePlay" title="Play mode">
        <span class="dot"></span> play
      </button>
      <div class="instrument-nav">
        <button type="button" class="icon-btn" id="voicePrev" aria-label="Previous voice">‹</button>
        <span class="instrument-name" id="voiceName">Steel</span>
        <button type="button" class="icon-btn" id="voiceNext" aria-label="Next voice">›</button>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="btnHelp" aria-label="Help" title="Help">?</button>
        <button type="button" class="icon-btn exit-btn" id="btnExit" aria-label="Exit" title="Exit">×</button>
      </div>
    </header>

    <!-- Left controls -->
    <aside class="sidebar left">
      <div class="control-block control-scale">
        <label class="control-label">Scale</label>
        <div class="stepper scale-stepper">
          <button type="button" class="step" id="scalePrev" aria-label="Previous scale">‹</button>
          <span class="step-value scale-name" id="scaleLabel">Celtic Minor</span>
          <button type="button" class="step" id="scaleNext" aria-label="Next scale">›</button>
        </div>
      </div>

      <div class="control-block">
        <label class="control-label">Base Note</label>
        <div class="stepper">
          <button type="button" class="step" id="rootDown" aria-label="Lower root">−</button>
          <span class="step-value" id="rootLabel">D</span>
          <button type="button" class="step" id="rootUp" aria-label="Raise root">+</button>
        </div>
      </div>

      <div class="control-block">
        <label class="control-label">Octave</label>
        <div class="stepper">
          <button type="button" class="step" id="octDown" aria-label="Octave down">−</button>
          <span class="step-value" id="octLabel">0</span>
          <button type="button" class="step" id="octUp" aria-label="Octave up">+</button>
        </div>
      </div>
    </aside>

    <!-- Center instrument -->
    <main class="stage">
      <canvas id="pan" width="800" height="800" aria-label="Handpan instrument"></canvas>
      <p class="hint" id="hint">Tap the steel · Q–O keys</p>
    </main>

    <!-- Sound knobs (right / bottom on mobile) -->
    <aside class="sidebar right knobs-panel" aria-label="Sound knobs">
      <div class="knob-wrap" data-param="tone">
        <div class="knob" id="knobTone" role="slider" tabindex="0"
             aria-label="Tone" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"
             aria-valuetext="Tone 70 percent">
          <canvas class="knob-canvas" width="88" height="88" aria-hidden="true"></canvas>
          <span class="knob-value" id="valTone">70</span>
        </div>
        <span class="knob-name">Tone</span>
      </div>
      <div class="knob-wrap" data-param="delay">
        <div class="knob" id="knobDelay" role="slider" tabindex="0"
             aria-label="Delay" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15"
             aria-valuetext="Delay 15 percent">
          <canvas class="knob-canvas" width="88" height="88" aria-hidden="true"></canvas>
          <span class="knob-value" id="valDelay">15</span>
        </div>
        <span class="knob-name">Delay</span>
      </div>
      <div class="knob-wrap" data-param="reverb">
        <div class="knob" id="knobReverb" role="slider" tabindex="0"
             aria-label="Reverb" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25"
             aria-valuetext="Reverb 25 percent">
          <canvas class="knob-canvas" width="88" height="88" aria-hidden="true"></canvas>
          <span class="knob-value" id="valReverb">25</span>
        </div>
        <span class="knob-name">Reverb</span>
      </div>
      <p class="fx-caption" id="fxCaption" role="status">Drag knobs · Tone / Delay / Reverb</p>
    </aside>
  </div>

  <script type="module" src="./pionier-app.js"></script>
</body>
</html>
