    .stage {

      flex: 1 1 auto !important;

    #pan {
      display: block !important;
      aspect-ratio: 1 !important;
      margin-bottom: 0 !important;
    }
    .stage::before {
      left: 50% !important;
      top: auto !important;
      bottom: calc(var(--stage-bottom-reserve) + var(--pan-budget, 40vw) / 2) !important;
