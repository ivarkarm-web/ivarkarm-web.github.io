<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Handpan — Ivar Karm</title>
  <meta name="theme-color" content="#070708" />
  <style>html,body{margin:0;background:#070708;color:#aaa;font:15px/1.4 system-ui;min-height:100%}</style>
</head>
<body>
  <p id="appBoot" style="padding:2rem;text-align:center">Loading handpan…</p>
  <script>
  (async function () {
    try {
      var url = 'https://cdn.jsdelivr.net/gh/ivarkarm-web/ivarkarm-web.github.io@033ec0faf1/handpan-app/index.html';
      var r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var html = await r.text();
      html = html.replace(/settings-panel\.css\?v=\d+/g, 'settings-panel.css?v=9');
      html = html.replace(
        '<script src="./js/layout-boot.js?v=28"><\/script>\n  <script src="./js/settings-panel.js?v=1"><\/script>\n  <script type="module" src="./pionier-app.js?v=143"><\/script>',
        '<script src="./js/skin-palette.js?v=1"><\/script>\n  <script src="./js/customization-catalog.js?v=5"><\/script>\n  <script src="./js/layout-boot.js?v=30"><\/script>\n  <script src="./js/settings-panel.js?v=6"><\/script>\n  <script src="./js/settings-live-fix.js?v=7"><\/script>\n  <script src="./js/ambient-fx.js?v=12"><\/script>\n  <script src="./js/skin-mandala.js?v=4"><\/script>\n  <script type="module" src="./pionier-app.js?v=157"><\/script>'
      );
      html = html.replace(/<\/head>/i, '<link rel="stylesheet" href="./atelier.css?v=4"><\/head>');
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      var el = document.getElementById('appBoot');
      if (el) el.textContent = 'Failed to load: ' + e;
      console.error(e);
    }
  })();
  </script>
</body>
</html>
