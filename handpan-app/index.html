<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Handpan — Ivar Karm</title>
  <meta name="theme-color" content="#070708" />
  <style>body{margin:0;background:#070708;color:#ccc;font-family:system-ui;display:grid;place-items:center;min-height:100dvh}</style>
</head>
<body>
  <div id="appBoot">Loading handpan…</div>
  <script>
  (async () => {
    const parts = await Promise.all([0,1,2].map(i => fetch('./shell-part-'+i+'.txt?v=1').then(r => {
      if (!r.ok) throw new Error('part '+i+' HTTP '+r.status);
      return r.text();
    })));
    const html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  })().catch(e => {
    document.getElementById('appBoot').textContent = 'Failed to load: ' + e;
  });
  </script>
</body>
</html>
