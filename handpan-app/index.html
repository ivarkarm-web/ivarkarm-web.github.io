<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Handpan — Ivar Karm</title>
  <meta name="description" content="Playable virtual handpan — 9-note radial instrument with interval scales and dynamic transposition." />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./pionier.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Top bar -->
    <header class="topbar">
      <button type="button" class="pill play-pill" id="modePlay" title="Play mode">
        <span class="dot"></span> play
      </button>
      <div class="instrument-nav">
        <button type="button" class="icon-btn" id="voicePrev" aria-label="Previous voice">‹</button>
        <span class="instrument-name" id="voiceName">Steel</span>
        <button type="button" class="icon-btn" id="voiceNext" aria-label="Next voice">›</button>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="btnHelp" aria-label="Help" title="Help">?</button>
        <button type="button" class="icon-btn exit-btn" id="btnExit" aria-label="Exit" title="Exit">×</button>
      </div>
    </header>

    <!-- Left controls -->
    <aside class="sidebar left">
      <div class="control-block">
        <label class="control-label">Scale</label>
        <button type="button" class="control-main" id="scaleBtn">
          <span id="scaleLabel">Celtic Minor</span>
          <span class="chevron">▴</span>
        </button>
        <div class="scale-menu" id="scaleMenu" hidden></div>
      </div>

      <div class="control-block">
        <label class="control-label">Base Note</label>
        <div class="stepper">
          <button type="button" class="step" id="rootDown" aria-label="Lower root">−</button>
          <span class="step-value" id="rootLabel">D</span>
          <button type="button" class="step" id="rootUp" aria-label="Raise root">+</button>
        </div>
      </div>

      <div class="control-block">
        <label class="control-label">Octave</label>
        <div class="stepper">
          <button type="button" class="step" id="octDown" aria-label="Octave down">−</button>
          <span class="step-value" id="octLabel">0</span>
          <button type="button" class="step" id="octUp" aria-label="Octave up">+</button>
        </div>
      </div>
    </aside>

    <!-- Center instrument -->
    <main class="stage">
      <canvas id="pan" width="800" height="800" aria-label="Handpan instrument"></canvas>
      <p class="hint" id="hint">Tap the steel · Q–O keys</p>
    </main>

    <!-- Right rail -->
    <aside class="sidebar right">
      <button type="button" class="rail-btn is-on" data-fx="tone" title="Tone" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12c3-6 6-6 9 0s6 6 9 0"/><path d="M3 18c3-6 6-6 9 0s6 6 9 0"/></svg>
      </button>
      <button type="button" class="rail-btn" data-fx="pulse" title="Pulse" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12h3l2-6 3 12 2-8 2 4h8"/></svg>
      </button>
      <button type="button" class="rail-btn" data-fx="drone" title="Drone" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="10"/></svg>
      </button>
      <button type="button" class="rail-btn" data-fx="space" title="Space" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 18 L12 6 L20 18"/></svg>
      </button>
    </aside>
  </div>

  <script type="module" src="./pionier-app.js"></script>
</body>
</html>
