<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pionier — loading…</title>
  <meta name="theme-color" content="#070708" />
  <style>
    html, body { margin: 0; background: #070708; color: #eceae6; font: 14px/1.4 system-ui, sans-serif; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; opacity: 0.75; }
  </style>
</head>
<body>
  <div id="boot">Starting Pionier…</div>
  <script>
  (async function () {
    var boot = document.getElementById('boot');
    try {
      var url = 'https://raw.githubusercontent.com/ivarkarm-web/ivarkarm-web.github.io/9a058a8ccbf51905c486dbdc235a08b827dd52a2/handpan-app/index.html';
      var res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var html = await res.text();

      html = html.replace('href="./fx-editor.css?v=4"', 'href="./fx-editor.css?v=5"');
      if (html.indexOf('theme-light-overlays.css') === -1) {
        html = html.replace(
          '<link rel="stylesheet" href="./fx-editor.css?v=5" />',
          '<link rel="stylesheet" href="./fx-editor.css?v=5" />\n  <link rel="stylesheet" href="./theme-light-overlays.css?v=1" />'
        );
      }
      if (html.indexOf('looper-layout-fix.css') === -1) {
        var looperLink = '<link rel="stylesheet" href="./looper-layout-fix.css?v=1" />';
        if (html.indexOf('looper.css') !== -1) {
          html = html.replace(
            /<link rel="stylesheet" href="\.\/looper\.css\?v=[^"]+" \/>/,
            function (m) { return m + '\n  ' + looperLink; }
          );
        } else if (html.indexOf('theme-light-overlays.css') !== -1) {
          html = html.replace(
            '<link rel="stylesheet" href="./theme-light-overlays.css?v=1" />',
            '<link rel="stylesheet" href="./theme-light-overlays.css?v=1" />\n  ' + looperLink
          );
        } else {
          html = html.replace('</head>', '  ' + looperLink + '\n</head>');
        }
      }

      // Inject durable FX wiring into the written document (survives document.write).
      var fxFix = [
        '<script>',
        '(function () {',
        '  if (window.__pionierFxFix) return;',
        '  window.__pionierFxFix = true;',
        '',
        '  function ensureBtn() {',
        '    var btn = document.getElementById("fxPanelOpen");',
        '    if (btn) return btn;',
        '    btn = document.createElement("button");',
        '    btn.type = "button";',
        '    btn.id = "fxPanelOpen";',
        '    btn.className = "fx-panel-open";',
        '    btn.setAttribute("aria-label", "Effects");',
        '    btn.setAttribute("aria-expanded", "false");',
        '    btn.setAttribute("aria-controls", "fxPanel");',
        '    btn.textContent = "FX";',
        '    document.body.appendChild(btn);',
        '    return btn;',
        '  }',
        '',
        '  function showPanel(panel, btn) {',
        '    panel.hidden = false;',
        '    panel.removeAttribute("hidden");',
        '    panel.style.setProperty("display", "block", "important");',
        '    panel.style.setProperty("visibility", "visible", "important");',
        '    panel.style.setProperty("opacity", "1", "important");',
        '    panel.style.setProperty("pointer-events", "auto", "important");',
        '    panel.style.setProperty("z-index", "5000", "important");',
        '    document.body.classList.add("is-fx-open");',
        '    if (btn) btn.setAttribute("aria-expanded", "true");',
        '    try { window.PionierCore && window.PionierCore.ensureAudio && window.PionierCore.ensureAudio(); } catch (e) {}',
        '    try { window.PionierCore && window.PionierCore.paintFxKnobs && window.PionierCore.paintFxKnobs(); } catch (e) {}',
        '  }',
        '',
        '  function hidePanel(panel, btn) {',
        '    panel.hidden = true;',
        '    panel.setAttribute("hidden", "");',
        '    panel.style.removeProperty("display");',
        '    document.body.classList.remove("is-fx-open");',
        '    if (btn) btn.setAttribute("aria-expanded", "false");',
        '  }',
        '',
        '  function toggle() {',
        '    var panel = document.getElementById("fxPanel");',
        '    var btn = document.getElementById("fxPanelOpen");',
        '    if (!panel) { console.warn("[pionier] #fxPanel missing"); return; }',
        '    var open = !panel.hidden && !panel.hasAttribute("hidden") && getComputedStyle(panel).display !== "none";',
        '    if (open) hidePanel(panel, btn); else showPanel(panel, btn);',
        '  }',
        '',
        '  document.addEventListener("click", function (e) {',
        '    var t = e.target;',
        '    if (!t || !t.closest) return;',
        '    var btn = t.closest("#fxPanelOpen, button.fx-panel-open");',
        '    if (!btn) return;',
        '    e.preventDefault();',
        '    e.stopPropagation();',
        '    e.stopImmediatePropagation();',
        '    toggle();',
        '  }, true);',
        '',
        '  document.addEventListener("click", function (e) {',
        '    var t = e.target;',
        '    if (!t || !t.closest) return;',
        '    var close = t.closest("#fxPanelClose");',
        '    if (!close) return;',
        '    var panel = document.getElementById("fxPanel");',
        '    var btn = document.getElementById("fxPanelOpen");',
        '    if (panel) hidePanel(panel, btn);',
        '  }, true);',
        '',
        '  function bootFx() {',
        '    ensureBtn();',
        '    var panel = document.getElementById("fxPanel");',
        '    if (panel && !panel.querySelector("#fxPanelClose")) {',
        '      var hdr = panel.querySelector(".fx-panel-header") || panel;',
        '      var c = document.createElement("button");',
        '      c.type = "button";',
        '      c.id = "fxPanelClose";',
        '      c.className = "icon-btn";',
        '      c.setAttribute("aria-label", "Close effects");',
        '      c.textContent = "×";',
        '      hdr.appendChild(c);',
        '    }',
        '  }',
        '',
        '  if (document.readyState === "loading") {',
        '    document.addEventListener("DOMContentLoaded", bootFx);',
        '  } else {',
        '    bootFx();',
        '  }',
        '  setTimeout(bootFx, 300);',
        '  setTimeout(bootFx, 1000);',
        '  setTimeout(bootFx, 2500);',
        '})();',
        '<\/script>'
      ].join('\n');

      if (html.indexOf('__pionierFxFix') === -1) {
        if (html.indexOf('</body>') !== -1) {
          html = html.replace('</body>', fxFix + '\n</body>');
        } else {
          html += fxFix;
        }
      }

      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      boot.textContent = 'Failed to load Pionier: ' + e;
      console.error(e);
    }
  })();
  </script>
</body>
</html>
