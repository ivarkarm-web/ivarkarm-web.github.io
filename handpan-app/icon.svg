<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="60%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>
    <radialGradient id="shell" cx="42%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#34363f"/>
      <stop offset="35%" stop-color="#212228"/>
      <stop offset="70%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e08c"/>
      <stop offset="45%" stop-color="#a07d24"/>
      <stop offset="75%" stop-color="#e8cf79"/>
      <stop offset="100%" stop-color="#6b5314"/>
