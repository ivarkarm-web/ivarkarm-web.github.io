  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Outer glow -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#rim)" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="214" fill="url(#shell)"/>
  <!-- Tonefields ring -->
  <ellipse cx="256" cy="115" rx="36" ry="28" fill="#18191f" stroke="#c9a227" stroke-width="2.5" opacity="0.9"/>
  <ellipse cx="355" cy="155" rx="34" ry="26" fill="#18191f" stroke="#c9a227" stroke-width="2.5" opacity="0.9" transform="rotate(35 355 155)"/>
  <ellipse cx="395" cy="256" rx="34" ry="26" fill="#18191f" stroke="#c9a227" stroke-width="2.5" opacity="0.9" transform="rotate(90 395 256)"/>
  <ellipse cx="355" cy="355" rx="34" ry="26" fill="#18191f" stroke="#c9a227" stroke-width="2.5" opacity="0.9" transform="rotate(145 355 355)"/>
  <ellipse cx="256" cy="395" rx="36" ry="28" fill="#18191f" stroke="#c9a227" stroke-width="2.5" opacity="0.9"/>
  <ellipse cx="155" cy="355" rx="34" ry="26" fill="#18191f" stroke="#c9a227" stroke-width="2.5" opacity="0.9" transform="rotate(-145 155 355)"/>
  <ellipse cx="115" cy="256" rx="34" ry="26" fill="#18191f" stroke="#c9a227" stroke-width="2.5" opacity="0.9" transform="rotate(-90 115 256)"/>
  <ellipse cx="155" cy="155" rx="34" ry="26" fill="#18191f" stroke="#c9a227" stroke-width="2.5" opacity="0.9" transform="rotate(-35 155 155)"/>
